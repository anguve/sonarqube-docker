version: '3.8'

services:
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    depends_on:
      - db
    ports:
      - '9000:9000'
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonarqube
      SONAR_JDBC_USERNAME: ${SONARQUBE_JDBC_USERNAME}
      SONAR_JDBC_PASSWORD: ${SONARQUBE_JDBC_PASSWORD}
    volumes:
      - sonarqube_conf:/opt/sonarqube/conf
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

  db:
    image: postgres:13
    container_name: sonarqube_postgres
    environment:
      POSTGRES_USER: ${SONARQUBE_JDBC_USERNAME}
      POSTGRES_PASSWORD: ${SONARQUBE_JDBC_PASSWORD}
      POSTGRES_DB: sonarqube
    volumes:
      - postgresql:/var/lib/postgresql/data
      - ./sonar.properties:/opt/sonarqube/conf/sonar.properties

volumes:
  sonarqube_conf:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql:
